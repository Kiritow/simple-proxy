# With an ACME webroot, every port-80 server answers HTTP-01 challenges.
servers:
- server_name: plain.example.com
  default:
    port: 3000
- server_name: secure.example.com
  cert_name: "*.example.com"
  default:
    port: 3001
- server_name: alt.example.com
  listen_port: 8080
  default:
    port: 3002
