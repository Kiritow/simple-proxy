# Plain HTTP servers with defaults.
servers:
- server_name: example.com www.example.com
  default:
    port: 3000
- server_name: app.example.com
  listen_port: 8080
  default:
    path: /app
    ip: ::1
    port: 3000
    websocket: true
  locations:
  - path: /api
    port: 3001
  - path: /disabled
    enable: false
- server_name: disabled.example.com
  enable: false
  default:
    port: 3000
